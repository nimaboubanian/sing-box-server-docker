<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ — صفحه یافت نشد</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #f43f5e;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }
        p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .home-btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            background: #334155;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .home-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">۴۰۴</div>
        <h1>صفحه مورد نظر یافت نشد</h1>
        <p>آدرس وارد شده اشتباه است یا این صفحه حذف گردیده است.</p>
        <a href="/" class="home-btn">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
